name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # Murmur needs the macOS 26 SDK (SpeechAnalyzer, FoundationModels).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build.sh uses the commit count as the build number
      - name: Toolchain
        run: |
          swiftc --version
          sw_vers
      - name: Unit tests
        run: ./test.sh
      - name: Build
        run: ./build.sh
